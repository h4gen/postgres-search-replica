name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"

    - name: Install dependencies
      run: uv sync --extra test

    - name: Start Infrastructure
      run: |
        make dev
        echo "Waiting for Postgres to be ready..."
        # Wait for the containers to be healthy using pg_isready
        until docker exec dev-source-1 pg_isready -U postgres; do
          echo "Source DB not ready..."
          sleep 2
        done
        # Sink DB runs on port 54322 inside the container in local mode
        until docker exec dev-sink-1 pg_isready -U postgres -h localhost -p 54322; do
          echo "Sink DB not ready..."
          sleep 2
        done
        echo "Infrastructure is ready!"

    - name: Run Tests
      env:
        SOURCE_URL: postgresql://postgres:password@localhost:5433/production_db
        SINK_URL: postgresql://postgres@localhost:5434/postgres
      run: make test

    - name: Shutdown Infrastructure
      if: always()
      run: make down
