[project]
name = "sink-replicator"
version = "0.1.0"
description = "Postgres logical replication consumer with Polars"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1.0",
    "polars>=0.19.0",
    "numpy>=1.24.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-docker>=2.0.0",
]

[tool.uv]
managed = true

