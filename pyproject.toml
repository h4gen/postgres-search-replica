[project]
name = "pg-search-replica"
version = "0.1.0"
description = "PostgreSQL Search Replica with real-time vectorization using pgai"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1.0",
    "pydantic-settings>=2.1.0",
    "pgvector>=0.2.0",
    "pgai>=0.12.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "tokenizers>=0.19.0",
    "ijson>=3.3.0",
    "filetype>=1.2.0",
    "ollama>=0.2.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "litellm>=1.35.0",
    "langchain-text-splitters>=0.2.0",
    "psycopg-pool>=3.3.0",
    "python-json-logger>=4.0.0",
    "prometheus-client>=0.23.1",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-docker>=2.0.0",
    "ruff>=0.1.0",
    "ty>=0.0.1",
]

[tool.uv]
managed = true

